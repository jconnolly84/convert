<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Converter</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #1c1a17; --muted: #6f6a60; --line: #ddd6c8;
  --accent: #e2531d; --accent-ink: #fff; --ok: #2f7d4a; --err: #b3261e;
  --img: #3c6fd6; --aud: #9b44c9; --vid: #e2531d; --track: #ebe5d8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --panel: #1d1b18; --ink: #efe9dd; --muted: #a39c8f; --line: #34302a;
    --accent: #ff6a33; --accent-ink: #160b05; --ok: #5cc27e; --err: #ff7b72;
    --img: #6e9bff; --aud: #c27ef0; --vid: #ff6a33; --track: #2b2823;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --panel: #1d1b18; --ink: #efe9dd; --muted: #a39c8f; --line: #34302a;
  --accent: #ff6a33; --accent-ink: #160b05; --ok: #5cc27e; --err: #ff7b72;
  --img: #6e9bff; --aud: #c27ef0; --vid: #ff6a33; --track: #2b2823;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Space Grotesk", system-ui, sans-serif; }
.wrap { max-width: 920px; margin: 0 auto; padding: 40px 16px 80px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0; }
h1 span { color: var(--accent); }
.tag { font: 12px "JetBrains Mono", monospace; color: var(--muted); }
.engine { font: 12px "JetBrains Mono", monospace; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ready { background: var(--ok); } .dot.loading { background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

#drop { display: block; border: 2px dashed var(--line); border-radius: 14px; background: var(--panel); padding: 44px 20px; text-align: center; cursor: pointer; transition: border-color .15s, transform .15s; }
#drop:hover, #drop.over { border-color: var(--accent); }
#drop.over { transform: scale(1.01); }
#drop strong { font-size: 20px; display: block; margin-bottom: 4px; }
#drop p { margin: 0; color: var(--muted); }
.kinds { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.chip { font: 11px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 99px; border: 1px solid currentColor; }
.chip.image { color: var(--img); } .chip.audio { color: var(--aud); } .chip.video { color: var(--vid); } .chip.pdf { color: var(--ok); }
input.pages { font: 13px "JetBrains Mono", monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 110px; }

.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 28px 0 12px; flex-wrap: wrap; }
.bar h2 { font-size: 16px; margin: 0; }
button { font: inherit; font-weight: 500; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--ink); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }

.list { display: grid; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
.meta { min-width: 0; }
.name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font: 12px "JetBrains Mono", monospace; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
select { font: 13px "JetBrains Mono", monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.status { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.msg { font: 12px "JetBrains Mono", monospace; color: var(--muted); min-width: 120px; text-align: right; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
.actions { display: flex; gap: 6px; }
.actions a { font-weight: 500; color: var(--accent-ink); background: var(--ok); padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; }
.x { padding: 4px 9px; font-size: 13px; }
.empty { color: var(--muted); text-align: center; padding: 20px; font-size: 14px; }
footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
button.edit { font-size: 13px; padding: 5px 10px; border-color: var(--img); color: var(--img); }

/* ---------- editor ---------- */
.ed-backdrop { position: fixed; inset: 0; background: rgba(10, 9, 8, .6); z-index: 10; display: flex; padding: 16px; }
.ed { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.ed-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ed-file { font: 12px "JetBrains Mono", monospace; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-tools { display: flex; gap: 6px; }
.ed-tools button { padding: 4px 10px; }
.ed-body { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
.ed-stage { position: relative; background: repeating-conic-gradient(var(--track) 0 25%, var(--bg) 0 50%) 0 0 / 20px 20px; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
.ed-wrap { position: relative; touch-action: none; cursor: crosshair; user-select: none; }
.ed-wrap canvas { display: block; }
.ed-status { position: absolute; color: var(--ink); font-size: 14px; }
.ed-crop { position: absolute; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); outline: 1px solid #fff; cursor: move; }
.ed-guides b { position: absolute; top: 0; bottom: 0; border-left: 1px dashed #fff; pointer-events: none; }
.ed-guides b.t { border-left-color: rgba(255,255,255,.35); border-left-style: solid; }
.ed-guides b.h { top: auto; left: 0 !important; right: 0; bottom: auto; border-left: 0; border-top: 1px solid rgba(255,255,255,.35); }
.ed-labels span { position: absolute; bottom: 6px; text-align: center; font: 600 11px "JetBrains Mono", monospace; letter-spacing: .1em; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; }
.ed-h { position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid var(--accent); border-radius: 3px; margin: -7px 0 0 -7px; }
.ed-h.nw { left: 0; top: 0; cursor: nwse-resize; } .ed-h.n { left: 50%; top: 0; cursor: ns-resize; } .ed-h.ne { left: 100%; top: 0; cursor: nesw-resize; }
.ed-h.e { left: 100%; top: 50%; cursor: ew-resize; } .ed-h.se { left: 100%; top: 100%; cursor: nwse-resize; } .ed-h.s { left: 50%; top: 100%; cursor: ns-resize; }
.ed-h.sw { left: 0; top: 100%; cursor: nesw-resize; } .ed-h.w { left: 0; top: 50%; cursor: ew-resize; }
.ed-side { border-left: 1px solid var(--line); overflow-y: auto; padding: 4px 16px 16px; }
.ed-side section { padding: 12px 0; border-bottom: 1px solid var(--line); }
.ed-side section:last-child { border-bottom: 0; }
.ed-side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
.ed-side label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.ed-side label select, .ed-side label input[type=number] { display: block; width: 100%; margin-top: 3px; font: 13px "JetBrains Mono", monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.ed-side .ed-check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 13px; }
.ed-grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ed-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.ed-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.ed-q input { width: 100%; accent-color: var(--accent); }
.ed-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.ed-row button { font-size: 12px; padding: 5px 9px; }
.ed-hint { font-size: 12px; color: var(--muted); }
.dvd .ed-dvd-only { display: inline-block; } .ed-dvd-only { display: none; }
.ed-readout { margin-top: 10px; font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
.ed-readout b { color: var(--ink); font-family: "JetBrains Mono", monospace; }
.warn { color: var(--err); } .note { color: var(--muted); font-style: italic; }
.ed-export { width: 100%; margin-top: 6px; padding: 10px; }
.ed-results { display: grid; gap: 6px; margin-top: 10px; }
.ed-res { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; font-size: 13px; background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.ed-res .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-res .m { grid-row: 2; font: 11px "JetBrains Mono", monospace; color: var(--muted); }
.ed-res a { grid-row: 1 / 3; grid-column: 2; font-weight: 500; color: var(--accent-ink); background: var(--ok); padding: 6px 12px; border-radius: 8px; text-decoration: none; }
@media (max-width: 760px) {
  .ed-backdrop { padding: 0; }
  .ed { border-radius: 0; }
  .ed-body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  .ed-side { border-left: 0; border-top: 1px solid var(--line); }
}

@media (max-width: 640px) {
  .card { grid-template-columns: 1fr; }
  .opts { justify-content: flex-start; }
  .msg { min-width: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>convert<span>.</span></h1>
      <div class="tag">images · audio · video — converted in your browser, never uploaded</div>
    </div>
    <div class="engine"><span class="dot" id="engineDot"></span><span id="engineText">engine idle</span></div>
  </header>

  <label id="drop">
    <input type="file" id="picker" multiple hidden accept="image/*,audio/*,video/*,application/pdf,.pdf,.mkv,.flac,.opus,.heic,.tif,.tiff">
    <strong>Drop files here</strong>
    <p>or click to choose — add as many as you like</p>
    <div class="kinds"><span class="chip image">image</span><span class="chip audio">audio</span><span class="chip video">video</span><span class="chip pdf">pdf</span></div>
  </label>

  <div class="bar">
    <h2 id="count">No files yet</h2>
    <div style="display:flex;gap:8px">
      <button id="clearBtn" disabled>Clear</button>
      <button id="cancelBtn" disabled>Cancel</button>
      <button id="convertAll" class="primary" disabled>Convert all</button>
    </div>
  </div>
  <div class="list" id="list"><div class="empty">Your queue is empty.</div></div>

  <footer>Powered by FFmpeg (WebAssembly). The engine (~30 MB) downloads once, the first time you convert audio or video. Very large videos (over ~1 GB) may run out of browser memory.</footer>
</div>
<script src="vendor/jszip/jszip.min.js"></script>
<script src="vendor/docx/docx.js"></script>
<script src="vendor/pptxgenjs/pptxgen.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
